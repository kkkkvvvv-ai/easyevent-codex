name: Provider optimization workbench

on:
  push:
    branches: [codex/provider-workbench-20260915]
    paths:
      - .github/provider-stage.json
      - .github/provider-stage.py
      - .github/workflows/provider-workbench.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-optimization-workbench
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.stage.outputs.ready }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: control
          persist-credentials: false
      - name: Read the candidate manifest
        id: manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path('control/.github/provider-stage.json')
          if not path.exists():
              raise SystemExit(0)
          stage = json.loads(path.read_text())
          if not re.fullmatch(r'[0-9a-f]{40}', stage['base']):
              raise SystemExit('Invalid candidate base')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('base=' + stage['base'] + '\n')
          PY
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.manifest.outputs.base != ''
        with:
          path: source
          ref: ${{ steps.manifest.outputs.base }}
          persist-credentials: false
      - name: Restore build dependencies
        if: steps.manifest.outputs.base != ''
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/target
          key: provider-workbench-linux-${{ hashFiles('source/codex-rs/Cargo.lock', 'source/codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            provider-workbench-linux-${{ hashFiles('source/codex-rs/Cargo.lock', 'source/codex-rs/rust-toolchain.toml') }}-
      - name: Install Linux dependencies
        if: steps.manifest.outputs.base != ''
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: steps.manifest.outputs.base != ''
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        if: steps.manifest.outputs.base != ''
        with:
          tool: just@1.51.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        if: steps.manifest.outputs.base != ''
        with:
          tool: nextest
          version: 0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
        if: steps.manifest.outputs.base != ''
      - name: Install Python formatting runner
        if: steps.manifest.outputs.base != ''
        run: python3 -m pip install --user uv
      - name: Apply and validate the candidate
        id: stage
        if: steps.manifest.outputs.base != ''
        run: python3 control/.github/provider-stage.py source control/.github/provider-stage.json result
      - name: Upload validation evidence
        if: always() && steps.manifest.outputs.base != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: provider-stage-result
          path: result/
          retention-days: 1
          if-no-files-found: warn

  publish:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-stage-result
          path: result
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: publish
          ref: codex/provider-optimization-20260915
      - name: Commit only the verified candidate
        working-directory: publish
        env:
          TARGET_BRANCH: codex/provider-optimization-20260915
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat ../result/base.sha)"
          git apply --index --check ../result/validated.patch
          git apply --index ../result/validated.patch
          test "$(git write-tree)" = "$(cat ../result/candidate.tree)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -F ../result/commit-message.txt
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
